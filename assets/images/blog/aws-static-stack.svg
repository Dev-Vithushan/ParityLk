<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="The four AWS services used to host a static site: S3, CloudFront, Certificate Manager and Route 53.">
  <rect width="1200" height="460" fill="#fffdf6"/>
  <g font-family="'Plus Jakarta Sans','Helvetica Neue',Helvetica,Arial,sans-serif">
    <text x="60" y="76" font-size="34" font-weight="800" fill="#111111">Four services, nothing else</text>
    <text x="60" y="112" font-size="20" fill="#5d5644">Storage, delivery, certificate, name.</text>

    <!-- S3 -->
    <g>
      <rect x="60" y="160" width="252" height="238" rx="18" fill="#ffffff" stroke="#ded5bd"/>
      <image href="assets/images/aws/s3.png" xlink:href="assets/images/aws/s3.png"
        x="130" y="192" width="112" height="112" preserveAspectRatio="xMidYMid meet"/>
      <text x="186" y="348" font-size="21" font-weight="800" fill="#111111" text-anchor="middle">Amazon S3</text>
      <text x="186" y="376" font-size="15" fill="#5d5644" text-anchor="middle">the files</text>
    </g>

    <!-- CloudFront -->
    <g>
      <rect x="336" y="160" width="252" height="238" rx="18" fill="#ffffff" stroke="#ded5bd"/>
      <image href="assets/images/aws/cloudfront.png" xlink:href="assets/images/aws/cloudfront.png"
        x="406" y="192" width="112" height="112" preserveAspectRatio="xMidYMid meet"/>
      <text x="462" y="348" font-size="21" font-weight="800" fill="#111111" text-anchor="middle">CloudFront</text>
      <text x="462" y="376" font-size="15" fill="#5d5644" text-anchor="middle">HTTPS and cache</text>
    </g>

    <!-- ACM -->
    <g>
      <rect x="612" y="160" width="252" height="238" rx="18" fill="#ffffff" stroke="#ded5bd"/>
      <image href="assets/images/aws/certificate-manager.png" xlink:href="assets/images/aws/certificate-manager.png"
        x="682" y="192" width="112" height="112" preserveAspectRatio="xMidYMid meet"/>
      <text x="738" y="348" font-size="21" font-weight="800" fill="#111111" text-anchor="middle">Certificate Manager</text>
      <text x="738" y="376" font-size="15" fill="#5d5644" text-anchor="middle">us-east-1 only</text>
    </g>

    <!-- Route 53 -->
    <g>
      <rect x="888" y="160" width="252" height="238" rx="18" fill="#ffffff" stroke="#ded5bd"/>
      <image href="assets/images/aws/route53.png" xlink:href="assets/images/aws/route53.png"
        x="958" y="192" width="112" height="112" preserveAspectRatio="xMidYMid meet"/>
      <text x="1014" y="348" font-size="21" font-weight="800" fill="#111111" text-anchor="middle">Route 53</text>
      <text x="1014" y="376" font-size="15" fill="#5d5644" text-anchor="middle">alias record</text>
    </g>
  </g>
</svg>
