<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Comparison of the S3 website endpoint and CloudFront with Origin Access Control.">
  <rect width="1200" height="520" fill="#fffdf6"/>
  <g font-family="'Plus Jakarta Sans','Helvetica Neue',Helvetica,Arial,sans-serif">
    <text x="60" y="76" font-size="34" font-weight="800" fill="#111111">Two ways to serve the bucket</text>
    <text x="60" y="112" font-size="20" fill="#5d5644">One is quick. One is the one you ship.</text>

    <g>
      <rect x="60" y="152" width="520" height="316" rx="16" fill="#ffffff" stroke="#ded5bd"/>
      <text x="96" y="198" font-size="22" font-weight="800" fill="#111111">S3 website endpoint</text>
      <text x="96" y="226" font-size="15" font-weight="700" fill="#5d5644" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace">http:// only</text>

      <g font-size="17" fill="#2f2b22">
        <circle cx="106" cy="264" r="7" fill="#f6c90e"/>
        <text x="128" y="270">Bucket must be publicly readable</text>
        <circle cx="106" cy="304" r="7" fill="#f6c90e"/>
        <text x="128" y="310">No HTTPS on a custom domain</text>
        <circle cx="106" cy="344" r="7" fill="#f6c90e"/>
        <text x="128" y="350">No edge cache, no global speed</text>
        <circle cx="106" cy="384" r="7" fill="#f6c90e"/>
        <text x="128" y="390">Index and error documents built in</text>
      </g>
      <text x="96" y="436" font-size="15" font-weight="700" fill="#5d5644">Fine for a throwaway test.</text>
    </g>

    <g>
      <rect x="620" y="152" width="520" height="316" rx="16" fill="#111111"/>
      <text x="656" y="198" font-size="22" font-weight="800" fill="#fffdf6">CloudFront + OAC</text>
      <text x="656" y="226" font-size="15" font-weight="700" fill="#f6c90e" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace">https:// everywhere</text>

      <g font-size="17" fill="#efe8d5">
        <path d="M660 258 l6 8 l14 -16" fill="none" stroke="#f6c90e" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="694" y="270">Bucket stays fully private</text>
        <path d="M660 298 l6 8 l14 -16" fill="none" stroke="#f6c90e" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="694" y="310">Free ACM certificate, auto renewed</text>
        <path d="M660 338 l6 8 l14 -16" fill="none" stroke="#f6c90e" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="694" y="350">Cached near the visitor</text>
        <path d="M660 378 l6 8 l14 -16" fill="none" stroke="#f6c90e" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="694" y="390">Custom error pages and redirects</text>
      </g>
      <text x="656" y="436" font-size="15" font-weight="700" fill="#c8bd9e">The default for anything with a domain.</text>
    </g>
  </g>
</svg>
