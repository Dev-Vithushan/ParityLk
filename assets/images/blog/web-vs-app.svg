<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Side by side comparison of what a website is good at versus what a mobile app is good at.">
  <rect width="1200" height="560" fill="#fffdf6"/>
  <g font-family="'Plus Jakarta Sans','Helvetica Neue',Helvetica,Arial,sans-serif">
    <rect x="60" y="60" width="520" height="440" rx="18" fill="#ffffff" stroke="#ded5bd"/>
    <rect x="620" y="60" width="520" height="440" rx="18" fill="#111111"/>

    <text x="100" y="122" font-size="28" font-weight="800" fill="#111111">Website</text>
    <text x="100" y="154" font-size="17" fill="#5d5644">for people who do not know you yet</text>

    <text x="660" y="122" font-size="28" font-weight="800" fill="#f6c90e">Mobile app</text>
    <text x="660" y="154" font-size="17" fill="#ffffff" opacity=".76">for people who already do</text>

    <g font-size="19" fill="#111111">
      <text x="128" y="216">Found through search</text>
      <text x="128" y="266">Opens from a link, no install</text>
      <text x="128" y="316">One build, every device</text>
      <text x="128" y="366">Update once, live for all</text>
      <text x="128" y="416">Lower cost to run</text>
    </g>
    <g fill="#f6c90e">
      <circle cx="106" cy="210" r="6"/><circle cx="106" cy="260" r="6"/><circle cx="106" cy="310" r="6"/>
      <circle cx="106" cy="360" r="6"/><circle cx="106" cy="410" r="6"/>
    </g>

    <g font-size="19" fill="#ffffff">
      <text x="688" y="216">Opened several times a week</text>
      <text x="688" y="266">Camera, GPS, offline storage</text>
      <text x="688" y="316">Push notifications</text>
      <text x="688" y="366">Works without signal</text>
      <text x="688" y="416">Two platforms to maintain</text>
    </g>
    <g fill="#f6c90e">
      <circle cx="666" cy="210" r="6"/><circle cx="666" cy="260" r="6"/><circle cx="666" cy="310" r="6"/>
      <circle cx="666" cy="360" r="6"/><circle cx="666" cy="410" r="6"/>
    </g>

    <text x="600" y="536" font-size="18" font-weight="700" fill="#5f4900" text-anchor="middle">Start left. Move right when the behaviour proves it.</text>
  </g>
</svg>
