<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Five marketing channels all directing traffic to your website, which converts it into enquiries.">
  <rect width="1200" height="520" fill="#fffdf6"/>
  <g font-family="'Plus Jakarta Sans','Helvetica Neue',Helvetica,Arial,sans-serif">
    <text x="60" y="72" font-size="34" font-weight="800" fill="#111111">Every channel lands on your site</text>
    <text x="60" y="108" font-size="20" fill="#5d5644">Which is why the site is the first thing to fix.</text>

    <g>
      <rect x="60" y="150" width="230" height="58" rx="12" fill="#ffffff" stroke="#ded5bd"/>
      <text x="175" y="186" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Search</text>
      <rect x="60" y="222" width="230" height="58" rx="12" fill="#ffffff" stroke="#ded5bd"/>
      <text x="175" y="258" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Paid ads</text>
      <rect x="60" y="294" width="230" height="58" rx="12" fill="#ffffff" stroke="#ded5bd"/>
      <text x="175" y="330" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Social</text>
      <rect x="60" y="366" width="230" height="58" rx="12" fill="#ffffff" stroke="#ded5bd"/>
      <text x="175" y="402" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Content</text>
      <rect x="60" y="438" width="230" height="58" rx="12" fill="#ffffff" stroke="#ded5bd"/>
      <text x="175" y="474" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Email</text>
    </g>

    <g stroke="#b88900" stroke-width="2.4" fill="none" stroke-dasharray="7 7">
      <path d="M296 179 C 400 179, 420 300, 520 312"/>
      <path d="M296 251 C 400 251, 430 300, 520 318"/>
      <path d="M296 323 H520"/>
      <path d="M296 395 C 400 395, 430 340, 520 328"/>
      <path d="M296 467 C 400 467, 420 350, 520 334"/>
    </g>

    <rect x="528" y="250" width="290" height="152" rx="16" fill="#111111"/>
    <text x="673" y="312" font-size="22" font-weight="800" fill="#f6c90e" text-anchor="middle">YOUR WEBSITE</text>
    <text x="673" y="348" font-size="16" fill="#ffffff" text-anchor="middle" opacity=".82">fast, clear, one next step</text>

    <path d="M834 326 H960" stroke="#b88900" stroke-width="3" fill="none"/>
    <path d="M948 316 L964 326 L948 336 Z" fill="#b88900"/>

    <rect x="972" y="286" width="168" height="80" rx="14" fill="#f6c90e"/>
    <text x="1056" y="334" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">Enquiries</text>
  </g>
